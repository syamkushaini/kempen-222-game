<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kempen 222 - Election Campaign Sim</title>
<style>
:root{--bg:#10141c;--panel:#1a2030;--panel2:#222a3d;--text:#e8ecf4;--dim:#8d97ad;--you:#f2b632;--a:#e0524d;--b:#4a8fe0;--ok:#4cc38a;--bad:#e0524d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
h1,h2,h3{margin:0 0 .5em}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border-radius:10px;padding:14px;margin-bottom:14px}
button{background:var(--panel2);color:var(--text);border:1px solid #33405e;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
button:hover:not(:disabled){border-color:var(--you)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--you);color:#1a1300;border-color:var(--you);font-weight:600}
.top{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stat b{display:block;font-size:20px}.stat span{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:10px;cursor:pointer}
.tile.sel{border-color:var(--you)}
.tile small{color:var(--dim)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0;background:#000}
.bar i{display:block}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.actions button{text-align:left}
.actions button small{display:block;color:var(--dim)}
.log{max-height:220px;overflow:auto;font-size:13px;color:var(--dim)}
.log div{padding:3px 0;border-bottom:1px solid #263050}
.pol{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pol label{display:block;background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:10px;cursor:pointer}
.pol label.on{border-color:var(--you)}
.pol input{display:none}
.legend span{margin-right:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);border-radius:12px;padding:20px;max-width:520px;width:100%}
.modal .box button{display:block;width:100%;margin-top:8px;text-align:left}
.note{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;text-align:right;border-bottom:1px solid #263050}td:first-child,th:first-child{text-align:left}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// ---------- Data ----------
// All parties are fictional. Regions are real state groupings; seat counts total 222.
const PARTIES = {
  P:{name:"Parti Wawasan Rakyat",short:"PWR",color:"var(--you)",hex:"#f2b632"},
  A:{name:"Barisan Warisan",short:"BW",color:"var(--a)",hex:"#e0524d"},
  B:{name:"Pakatan Suara Baru",short:"PSB",color:"var(--b)",hex:"#4a8fe0"}
};
// urban/youth 0-1; la/lb = baseline strength of rivals (player starts at ~0)
const REGIONS = [
  {id:"kedah",  name:"Perlis & Kedah",    seats:18,urban:.30,youth:.45,la:42,lb:22},
  {id:"penang", name:"Penang",            seats:13,urban:.85,youth:.50,la:18,lb:42},
  {id:"perak",  name:"Perak",             seats:24,urban:.55,youth:.40,la:32,lb:32},
  {id:"selangor",name:"Selangor",         seats:22,urban:.90,youth:.60,la:22,lb:40},
  {id:"kl",     name:"KL & Putrajaya",    seats:12,urban:1.0,youth:.60,la:20,lb:42},
  {id:"nsm",    name:"N. Sembilan & Melaka",seats:14,urban:.55,youth:.50,la:34,lb:28},
  {id:"johor",  name:"Johor",             seats:26,urban:.60,youth:.55,la:36,lb:28},
  {id:"pahang", name:"Pahang",            seats:14,urban:.35,youth:.45,la:40,lb:22},
  {id:"ktan",   name:"Kelantan & Terengganu",seats:22,urban:.30,youth:.50,la:44,lb:16},
  {id:"sabah",  name:"Sabah & Labuan",    seats:26,urban:.40,youth:.55,la:30,lb:24},
  {id:"sarawak",name:"Sarawak",           seats:31,urban:.45,youth:.50,la:34,lb:24}
];
const POLICIES = [
  {id:"cost",  name:"Cost-of-living package",  desc:"Targeted cash aid and price controls on staples.", fit:r=>.55+.3*(1-r.urban)+.15*r.youth},
  {id:"corrupt",name:"Independent anti-graft commission",desc:"Politicians' assets declared, prosecutors independent.", fit:r=>.35+.6*r.urban},
  {id:"jobs",  name:"Youth jobs guarantee",    desc:"Wage subsidies and apprenticeships.", fit:r=>.35+.65*r.youth},
  {id:"edu",   name:"Education reform",        desc:"Tuition relief, school upgrades, loan write-downs.", fit:r=>.30+.5*r.youth+.2*(1-r.urban)},
  {id:"health",name:"Rural health expansion",  desc:"Clinics and hospitals outside the big cities.", fit:r=>.35+.55*(1-r.urban)+.1*r.youth},
  {id:"transit",name:"Public transport boom",  desc:"Rail, buses and EV subsidies.", fit:r=>.10+.9*r.urban}
];
const WEEKS = 12, AP = 3, START_FUNDS = 10, MAJORITY = 112;

const EVENTS = [
  {t:"Cost-of-living protests",d:"Prices keep climbing. Crowds gather outside parliament.",
   o:[{l:"Join the protest (-1 funds, trust +4)",f:s=>{s.funds-=1;s.trust+=4}},
      {l:"Issue a policy statement (momentum +2 nationwide)",f:s=>mom(s,"P",2)}]},
  {t:"Leaked audio of a rival",d:"A recording surfaces suggesting a rival minister interfered in a contract.",
   o:[{l:"Publicise it (rival B -4 nationwide, trust -3 if it looks dirty)",f:s=>{mom(s,"B",-4);s.trust-=3}},
      {l:"Stay above it (trust +3)",f:s=>{s.trust+=3}}]},
  {t:"Floods in the east coast",d:"Thousands displaced. Relief is slow.",
   o:[{l:"Send volunteers (-2 funds; +8 momentum Kelantan/Terengganu & Pahang)",f:s=>{s.funds-=2;momR(s,"ktan","P",8);momR(s,"pahang","P",8)}},
      {l:"Make a donation statement (+1 trust)",f:s=>{s.trust+=1}}]},
  {t:"Donor offers big cheque",d:"A businessman offers RM4m, no conditions stated. Reporters are curious.",
   o:[{l:"Accept (+4 funds, trust -6)",f:s=>{s.funds+=4;s.trust-=6}},
      {l:"Decline publicly (trust +4)",f:s=>{s.trust+=4}}]},
  {t:"Viral video of your candidate",d:"A candidate's off-the-cuff speech goes viral.",
   o:[{l:"Lean in with a social media push (-1 funds, momentum +3 nationwide, youth areas +4)",f:s=>{s.funds-=1;mom(s,"P",3);REGIONS.forEach(r=>{if(r.youth>=.55)momR(s,r.id,"P",4)})}},
      {l:"Distance the party from it (trust +1)",f:s=>{s.trust+=1}}]},
  {t:"Rival B coalition wobble",d:"Allies of Pakatan Suara Baru are squabbling over seat allocations.",
   o:[{l:"Court their defectors (-1 funds, B -4, you +3 in urban seats)",f:s=>{s.funds-=1;mom(s,"B",-4);REGIONS.forEach(r=>{if(r.urban>=.6)momR(s,r.id,"P",3)})}},
      {l:"Ignore it",f:s=>{}}]},
  {t:"Rival A hands out goodies",d:"Barisan Warisan announces a surprise rural aid package.",
   o:[{l:"Call it vote-buying (trust +2, A -3 in rural seats)",f:s=>{s.trust+=2;REGIONS.forEach(r=>{if(r.urban<.5)momR(s,r.id,"A",-3)})}},
      {l:"Match it on a budget (-2 funds, you +4 in rural seats)",f:s=>{s.funds-=2;REGIONS.forEach(r=>{if(r.urban<.5)momR(s,r.id,"P",4)})}}]},
  {t:"Tough TV debate",d:"You're invited to the national leaders' debate.",
   o:[{l:"Attack both rivals (momentum +4, trust -2)",f:s=>{mom(s,"P",4);s.trust-=2}},
      {l:"Stay on policy (trust +4, momentum +1)",f:s=>{s.trust+=4;mom(s,"P",1)}}]},
  {t:"Economy wobbles",d:"The ringgit weakens and the incumbent gets blamed.",
   o:[{l:"Pitch economic credibility (A -3 nationwide, +2 you)",f:s=>{mom(s,"A",-3);mom(s,"P",2)}},
      {l:"Keep to your plan",f:s=>{}}]}
];

// ---------- State ----------
let S = null;
let ui = {sel:"selangor",busy:false};

function newState(chosen){
  const s={week:1,ap:AP,funds:START_FUNDS,trust:50,chosen,mom:{},log:[],ended:false,usedEvents:[],event:null};
  REGIONS.forEach(r=>s.mom[r.id]={P:0,A:0,B:0});
  return s;
}
function mom(s,p,v){REGIONS.forEach(r=>momR(s,r.id,p,v))}
function momR(s,id,p,v){s.mom[id][p]=clamp(s.mom[id][p]+v,-25,40)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ---------- Model ----------
function fit(r){
  const c=S.chosen.map(id=>POLICIES.find(p=>p.id===id).fit(r));
  return c.reduce((a,b)=>a+b,0)/c.length; // 0..1
}
function scores(r){
  const m=S.mom[r.id], tr=(S.trust-50)*.25;
  return {
    P:Math.max(1,8+fit(r)*26+m.P+tr),
    A:Math.max(1,r.la+m.A),
    B:Math.max(1,r.lb+m.B)
  };
}
function shares(r){
  const sc=scores(r), t=sc.P+sc.A+sc.B;
  return {P:sc.P/t*100,A:sc.A/t*100,B:sc.B/t*100};
}
// seats by share^3 (FPTP exaggerates leads), largest-remainder
function seatsFor(r,noise=0){
  const sh=shares(r), w={};let tot=0;
  for(const k in sh){w[k]=Math.pow(Math.max(1,sh[k]+(noise?rnd(-noise,noise):0)),3);tot+=w[k]}
  const raw={},out={};let used=0;
  for(const k in w){raw[k]=w[k]/tot*r.seats;out[k]=Math.floor(raw[k]);used+=out[k]}
  Object.keys(raw).sort((x,y)=>(raw[y]-out[y])-(raw[x]-out[x])).slice(0,r.seats-used).forEach(k=>out[k]++);
  return out;
}
function totalSeats(noise=0){
  const t={P:0,A:0,B:0};
  REGIONS.forEach(r=>{const s=seatsFor(r,noise);for(const k in s)t[k]+=s[k]});
  return t;
}
function leader(r){const sh=shares(r);return Object.keys(sh).sort((a,b)=>sh[b]-sh[a])[0]}

// ---------- Actions ----------
const ACTIONS = [
  {id:"rally",name:"Rally",cost:2,desc:"+10 support in selected region",run:(s,r)=>{momR(s,r.id,"P",10);return `Rally in ${r.name}.`}},
  {id:"ground",name:"Ground campaign",cost:1,desc:"+5 support in selected region",run:(s,r)=>{momR(s,r.id,"P",5);return `Door-to-door in ${r.name}.`}},
  {id:"media",name:"National media blitz",cost:3,desc:"+2 everywhere",global:true,run:s=>{mom(s,"P",2);return "National media blitz."}},
  {id:"attackA",name:"Attack Barisan Warisan",cost:2,desc:"-6 BW in region; 30% backlash",run:(s,r)=>attack(s,r,"A")},
  {id:"attackB",name:"Attack Pakatan Suara Baru",cost:2,desc:"-6 PSB in region; 30% backlash",run:(s,r)=>attack(s,r,"B")},
  {id:"fund",name:"Fundraise",cost:0,gain:3,desc:"+3 funds, no region needed",global:true,run:s=>{s.funds+=3;return "Fundraising dinner raised RM3m."}}
];
function attack(s,r,t){
  momR(s,r.id,t,-6);
  if(Math.random()<.3){momR(s,r.id,"P",-3);s.trust-=1;return `Attack on ${PARTIES[t].short} in ${r.name} backfired.`}
  return `Attack on ${PARTIES[t].short} in ${r.name} landed.`;
}
function doAction(id){
  const a=ACTIONS.find(x=>x.id===id), r=REGIONS.find(x=>x.id===ui.sel);
  if(S.ap<1||S.funds<a.cost)return;
  S.funds-=a.cost;S.ap--;
  addLog(a.run(S,r));
  render();
}
function addLog(t){S.log.unshift(`Wk ${S.week}: ${t}`)}

function endWeek(){
  // decay momentum
  REGIONS.forEach(r=>{for(const k in S.mom[r.id])S.mom[r.id][k]*=.92});
  // rivals campaign
  ["A","B"].forEach(k=>{
    const targets=[...REGIONS].sort(()=>Math.random()-.5).slice(0,2);
    targets.forEach(r=>momR(S,r.id,k,rnd(3,7)));
    if(Math.random()<.35){const r=pick(REGIONS);momR(S,r.id,"P",-4);addLog(`${PARTIES[k].short} ran attack ads against you in ${r.name}.`)}
  });
  S.week++;S.ap=AP;S.funds+=1; // small donations
  if(S.week>WEEKS){S.ended=true;render();return}
  if(S.week%2===0){
    const pool=EVENTS.filter((_,i)=>!S.usedEvents.includes(i));
    const e=pick(pool.length?pool:EVENTS);S.usedEvents.push(EVENTS.indexOf(e));S.event=e;
  }
  render();
}
function chooseEvent(i){
  const o=S.event.o[i];o.f(S);S.trust=clamp(S.trust,0,100);S.funds=Math.max(0,S.funds);
  addLog(`${S.event.t}: ${o.l.replace(/\s*\(.*\)/,"")}`);S.event=null;render();
}

// ---------- Rendering ----------
const app=document.getElementById("app");

function bar(sh){return `<div class="bar">${["P","A","B"].map(k=>`<i style="width:${sh[k]}%;background:${PARTIES[k].hex}"></i>`).join("")}</div>`}

function renderSetup(){
  const sel=ui.pick||[];
  app.innerHTML=`<div class="panel"><h1>Kempen 222</h1>
  <p>You lead <b>${PARTIES.P.name}</b>, a challenger party, in a 222-seat general election. Two fictional heavyweights stand in your way: <b style="color:var(--a)">${PARTIES.A.name}</b> (strong in the rural heartland) and <b style="color:var(--b)">${PARTIES.B.name}</b> (strong in the cities). You have ${WEEKS} weeks. Win 112 seats for a majority, or finish as kingmaker.</p>
  <h3>Choose 3 flagship policies <span class="note">(${sel.length}/3)</span></h3>
  <div class="pol">${POLICIES.map(p=>`<label class="${sel.includes(p.id)?"on":""}" data-p="${p.id}"><b>${p.name}</b><br><span class="note">${p.desc}</span></label>`).join("")}</div>
  <p class="note">Policies appeal differently: youth jobs and education play in young seats, anti-graft and transport play in cities, health and cost-of-living play in rural areas.</p>
  <button class="primary" id="start" ${sel.length===3?"":"disabled"}>Begin campaign</button></div>`;
  app.querySelectorAll("[data-p]").forEach(l=>l.onclick=()=>{
    const id=l.dataset.p;ui.pick=ui.pick||[];
    if(ui.pick.includes(id))ui.pick=ui.pick.filter(x=>x!==id);else if(ui.pick.length<3)ui.pick.push(id);
    renderSetup();
  });
  document.getElementById("start").onclick=()=>{S=newState(ui.pick);render()};
}

function render(){
  if(!S)return renderSetup();
  if(S.ended)return renderResults();
  const proj=totalSeats(), r=REGIONS.find(x=>x.id===ui.sel), sh=shares(r), sc=seatsFor(r);
  app.innerHTML=`
  <div class="panel top">
    <div class="stat"><span>Week</span><b>${S.week} / ${WEEKS}</b></div>
    <div class="stat"><span>Actions left</span><b>${S.ap}</b></div>
    <div class="stat"><span>Funds</span><b>RM${S.funds}m</b></div>
    <div class="stat"><span>Public trust</span><b>${Math.round(S.trust)}</b></div>
    <div class="stat"><span>Projected seats</span><b><span style="color:var(--you)">${proj.P}</span> · <span style="color:var(--a)">${proj.A}</span> · <span style="color:var(--b)">${proj.B}</span></b></div>
    <button class="primary" id="end" ${S.event?"disabled":""}>End week →</button>
  </div>
  <div class="legend note panel">${Object.values(PARTIES).map(p=>`<span><i class="dot" style="background:${p.hex}"></i>${p.name}</span>`).join("")} · Need ${MAJORITY} for a majority</div>
  <div class="cols"><div>
    <div class="panel"><h3>Regions</h3><div class="grid">${REGIONS.map(x=>{
      const s=shares(x),l=leader(x);
      return `<div class="tile ${x.id===ui.sel?"sel":""}" data-r="${x.id}" style="border-left:4px solid ${PARTIES[l].hex}"><b>${x.name}</b><br><small>${x.seats} seats</small>${bar(s)}<small>${PARTIES.P.short} ${s.P.toFixed(0)}% · ${PARTIES.A.short} ${s.A.toFixed(0)}% · ${PARTIES.B.short} ${s.B.toFixed(0)}%</small></div>`}).join("")}</div></div>
  </div><div>
    <div class="panel"><h3>${r.name}</h3>
      <div class="note">${r.seats} seats · ${Math.round(r.urban*100)}% urban · ${Math.round(r.youth*100)}% youth-heavy</div>
      ${bar(sh)}
      <div>Platform fit: <b>${Math.round(fit(r)*100)}%</b></div>
      <div>Projected: <span style="color:var(--you)">${sc.P}</span> · <span style="color:var(--a)">${sc.A}</span> · <span style="color:var(--b)">${sc.B}</span></div>
    </div>
    <div class="panel"><h3>Actions</h3><div class="actions">${ACTIONS.map(a=>{
      const dis=S.ap<1||S.funds<a.cost||S.event;
      return `<button data-a="${a.id}" ${dis?"disabled":""}>${a.name} <small>${a.cost?`RM${a.cost}m · `:""}${a.desc}</small></button>`}).join("")}</div></div>
    <div class="panel"><h3>Log</h3><div class="log">${S.log.map(l=>`<div>${l}</div>`).join("")||"<div>Campaign begins.</div>"}</div></div>
  </div></div>
  ${S.event?`<div class="modal"><div class="box"><h2>${S.event.t}</h2><p>${S.event.d}</p>${S.event.o.map((o,i)=>`<button data-e="${i}">${o.l}</button>`).join("")}</div></div>`:""}`;
  app.querySelectorAll("[data-r]").forEach(e=>e.onclick=()=>{ui.sel=e.dataset.r;render()});
  app.querySelectorAll("[data-a]").forEach(e=>e.onclick=()=>doAction(e.dataset.a));
  app.querySelectorAll("[data-e]").forEach(e=>e.onclick=()=>chooseEvent(+e.dataset.e));
  document.getElementById("end").onclick=endWeek;
}

function renderResults(){
  // election day has a little noise
  const per=REGIONS.map(r=>({r,s:seatsFor(r,4)}));
  const t={P:0,A:0,B:0};per.forEach(x=>{for(const k in x.s)t[k]+=x.s[k]});
  const order=Object.keys(t).sort((a,b)=>t[b]-t[a]);
  let head,body;
  if(t.P>=MAJORITY){head="Landslide! You form the government.";body=`${PARTIES.P.name} wins ${t.P} seats and a majority.`}
  else if(order[0]==="P"){head="Largest party";body=`You win ${t.P} seats, short of ${MAJORITY}. You must form a coalition with ${t.A>t.B?PARTIES.A.name:PARTIES.B.name}.`}
  else if(t.P>=30){head="Kingmaker";body=`With ${t.P} seats you hold the balance. ${PARTIES[order[0]].name} needs you to govern.`}
  else if(t.P>=10){head="Respectable opposition";body=`${t.P} seats. Not power yet, but you're on the map.`}
  else {head="Wiped out";body=`Only ${t.P} seats. Time to rebuild.`}
  app.innerHTML=`<div class="panel"><h1>${head}</h1><p>${body}</p>
  <h3>Final seats</h3><p>${order.map(k=>`<span style="color:${PARTIES[k].hex}"><b>${PARTIES[k].short}</b> ${t[k]}</span>`).join(" · ")}</p>
  <table><tr><th>Region</th><th>${PARTIES.P.short}</th><th>${PARTIES.A.short}</th><th>${PARTIES.B.short}</th></tr>
  ${per.map(x=>`<tr><td>${x.r.name}</td><td>${x.s.P}</td><td>${x.s.A}</td><td>${x.s.B}</td></tr>`).join("")}</table>
  <p><button class="primary" id="again">Play again</button></p></div>`;
  document.getElementById("again").onclick=()=>{S=null;ui.pick=[];render()};
}

render();
</script>
</body>
</html>
