name: Publish the game

# Manual on purpose: pushing code does not put the game online. Run this from
# the Actions tab (Run workflow) when you are ready for the public to see it.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The leaderboard's address and public key, if the maker has set them as repository variables; without them the game has no leaderboard.
      - run: npm run build
        env:
          VITE_LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}
          VITE_LEADERBOARD_KEY: ${{ vars.LEADERBOARD_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
