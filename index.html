<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kempen 222</title>
    <meta name="description" content="Kempen 222: a satirical Malaysian election strategy game. Fight a by-election, a state or general election, or a five-year career. Every party and person in it is invented." />
    <meta name="theme-color" content="#efece4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c111b" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kempen 222" />
    <meta property="og:description" content="A satirical Malaysian election strategy game. Every party and person in it is invented." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e8b04a'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='700' text-anchor='middle' fill='%230c111b'%3E222%3C/text%3E%3C/svg%3E" />
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0c111b; color: #f4f1e8; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity 0.35s ease; }
      @media (prefers-color-scheme: light) { #splash { background: #efece4; color: #1b2330; } }
      #splash.gone { opacity: 0; pointer-events: none; }
      .splash-mark { display: grid; place-items: center; width: 84px; height: 56px; border-radius: 12px; background: #5e6ad2; color: #fff; font-weight: 800; font-size: 30px; letter-spacing: 1px; }
      .splash-name { font-weight: 700; font-size: 20px; letter-spacing: 0.4px; }
      .splash-bar { width: 140px; height: 3px; border-radius: 2px; background: rgba(128, 128, 128, 0.3); overflow: hidden; }
      .splash-bar span { display: block; width: 40%; height: 100%; background: #5e6ad2; animation: splash-run 1.1s ease-in-out infinite; }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { .splash-bar span { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- The splash is plain HTML and CSS, so that it is on screen before any script has loaded. The app removes it once it has drawn. -->
    <div id="splash" role="status" aria-label="Kempen 222">
      <div class="splash-mark">222</div>
      <div class="splash-name">Kempen 222</div>
      <div class="splash-bar"><span></span></div>
    </div>
    <noscript>Kempen 222 is a game that runs in the browser and needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
